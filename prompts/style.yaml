# Shared style settings. Every unit inherits these unless it overrides them.
# Mirrors the art-direction doc: pixel art, 3/4 top-down ("low top-down" in
# PixelLab), 1px dark outline, light from the top-left.
view: low top-down
outline: single color black outline
detail: medium detail
no_background: true
# Directions we actually generate animations for. The other three
# (south-west, west, north-west) are produced by horizontal mirroring.
drawn_directions: [south, south-east, east, north-east, north]
mirror_map:
  south-west: south-east
  west: east
  north-west: north-east
# Master palette lock. Off (null) during the trial: Endesga 32 is only a
# placeholder and visibly shifts greys to blue and skin to pink (see
# preview/palette_compare.png). Pick the real palette in the tone-image phase,
# then set e.g. `palette: palettes/endesga-32.hex` and re-run postprocess.py.
palette: null

# Animations generated with PixelLab for every unit unless its YAML overrides
# (same name) or sets `skip: true`. Attack and death are AI hand-edited from
# the base poses (scripts/handedit.py), so they are not generated here.
# "rest" is not generated either: the game plays idle slowly with a Zzz icon.
default_animations:
  - name: idle
    action: standing in place, gentle breathing, slight body bob, seamless loop
    frames: 4
  - name: walk
    action: walking forward in a seamless looping walk cycle, legs alternating clearly, body facing the same direction throughout
    frames: 6
