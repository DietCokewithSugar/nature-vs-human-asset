<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const DIRS = { south: 0, 'south-east': 45, east: 90, 'north-east': 135, north: 180, 'north-west': 225, west: 270, 'south-west': 315 };
const ease = (t) => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;

// bone roles by name (Tripo, Mixamo-ish and sample rigs)
function roles(root) {
  const r = { spine: [], neck: [], head: [], frontUpper: [], frontLower: [], hindUpper: [], tail: [], hips: null, jaw: null };
  root.traverse((o) => {
    if (!o.isBone) return;
    const n = o.name.toLowerCase();
    if (/jaw/.test(n)) r.jaw = o;
    else if (/head/.test(n) && !/end|top/.test(n)) r.head.push(o);
    else if (/neck/.test(n)) r.neck.push(o);
    else if (/spine|chest/.test(n)) r.spine.push(o);
    else if (/hip|pelvis/.test(n) && !r.hips) r.hips = o;
    else if (/tail/.test(n)) r.tail.push(o);
    else if (/(upperarm|front.*(leg|thigh|upper)|(^|_)arm|shoulder|clavicle)/.test(n) && !/fore|hand/.test(n)) r.frontUpper.push(o);
    else if (/(forearm|front.*(lower|calf|shin)|hand)/.test(n)) r.frontLower.push(o);
    else if (/(leg01|thigh|upleg|back.*leg|hind)/.test(n)) r.hindUpper.push(o);
  });
  return r;
}

const _q = new THREE.Quaternion(), _pw = new THREE.Quaternion(), _bw = new THREE.Quaternion();
function rotWorld(bone, axis, angle) {     // rotate a bone about a model-space axis
  if (!bone || !angle) return;
  bone.parent.getWorldQuaternion(_pw); bone.getWorldQuaternion(_bw);
  _q.setFromAxisAngle(axis, angle);
  bone.quaternion.copy(_pw.clone().invert().multiply(_q).multiply(_bw));
  bone.updateMatrixWorld(true);
}
const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);

// procedural clips: pose(t) applied on top of the rest pose. Angles in radians; positive pitch = nose down.
function procPose(kind, t, R, holder, size) {
  const L = size.z;   // body length
  if (kind === 'idle') {
    const s = Math.sin(t * Math.PI * 2);
    R.spine.forEach((b) => rotWorld(b, X, 0.02 * s));
    R.neck.forEach((b) => rotWorld(b, X, 0.04 * s));
    holder.position.y = -0.006 * L * (s + 1);
  } else if (kind === 'attack') {
    // keys: 0 stance, .25 anticipation (crouch back, head low), .45 strike (lunge, head forward/up), .75 hold, 1 recover
    const K = [[0, 0, 0, 0, 0], [0.25, -1, 0, 0, 0], [0.45, 0, 1, 0, 0], [0.7, 0, 0.9, 0, 0], [1, 0, 0, 0, 0]];
    let a = 0, b = 0;
    for (let i = 0; i < K.length - 1; i++) if (t >= K[i][0] && t <= K[i + 1][0]) {
      const u = ease((t - K[i][0]) / (K[i + 1][0] - K[i][0]));
      a = lerp(K[i][1], K[i + 1][1], u); b = lerp(K[i][2], K[i + 1][2], u);
    }
    const crouch = Math.max(0, -a), strike = Math.max(0, b);
    holder.position.z = (-0.08 * crouch + 0.22 * strike) * L;
    holder.position.y = (-0.05 * crouch + 0.04 * strike) * L;
    holder.rotation.x = 0.10 * crouch - 0.12 * strike;            // pitch whole body: crouch nose-down, strike rears forward
    R.spine.forEach((bn) => rotWorld(bn, X, 0.05 * crouch - 0.06 * strike));
    R.neck.forEach((bn) => rotWorld(bn, X, 0.25 * crouch - 0.20 * strike));
    R.head.forEach((bn) => rotWorld(bn, X, 0.15 * crouch - 0.25 * strike));
    if (R.jaw) rotWorld(R.jaw, X, 0.6 * strike);
    R.frontUpper.forEach((bn) => rotWorld(bn, X, 0.25 * crouch - 0.9 * strike));
    R.frontLower.forEach((bn) => rotWorld(bn, X, -0.3 * crouch + 0.4 * strike));
    R.tail.forEach((bn, i) => rotWorld(bn, X, -0.15 * strike * (i + 1)));
  } else if (kind === 'death') {
    const u = ease(Math.min(1, t * 1.25));
    holder.rotation.z = -Math.PI / 2 * u;                          // roll onto its side
    holder.position.y = -0.05 * L * u;
    R.neck.forEach((bn) => rotWorld(bn, X, 0.3 * u));
    R.frontUpper.forEach((bn) => rotWorld(bn, X, -0.4 * u));
    R.hindUpper.forEach((bn) => rotWorld(bn, X, 0.4 * u));
  }
}

let renderer, scene, camera;
window.renderJob = async (cfg) => {
  const { url, size = 256, elevation = 38, clips, frameScale = 1.35, toon = true } = cfg;
  renderer = renderer || new THREE.WebGLRenderer({ antialias: false, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(size, size); renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);
  scene = new THREE.Scene();
  const g = await new GLTFLoader().loadAsync(url);
  const model = g.scene;
  // toon materials keep the texture, add 3 hard light bands (pixel-art friendly)
  const grad = new THREE.DataTexture(new Uint8Array([90, 170, 255, 255]), 4, 1, THREE.RedFormat);
  grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
  model.traverse((o) => {
    if (o.isMesh) {
      const m = o.material;
      if (toon) o.material = new THREE.MeshToonMaterial({ map: m.map || null, color: m.map ? 0xffffff : (m.color || 0xffffff), gradientMap: grad, });
      if (o.material.map) { o.material.map.minFilter = THREE.LinearFilter; }
      o.frustumCulled = false;
    }
  });
  // normalise: centre on x/z, feet on y=0, body length along +z
  const box0 = new THREE.Box3().setFromObject(model);
  const size0 = box0.getSize(new THREE.Vector3());
  const yaw = new THREE.Group(), holder = new THREE.Group();
  holder.add(model); yaw.add(holder); scene.add(yaw);
  model.position.set(-(box0.min.x + box0.max.x) / 2, -box0.min.y, -(box0.min.z + box0.max.z) / 2);
  const span = Math.max(size0.x, size0.y, size0.z) * frameScale;
  camera = new THREE.OrthographicCamera(-span / 2, span / 2, span / 2, -span / 2, -span * 10, span * 10);
  const e = elevation * Math.PI / 180;
  const target = new THREE.Vector3(0, size0.y * 0.45, 0);
  camera.position.copy(target).add(new THREE.Vector3(0, Math.sin(e), Math.cos(e)).multiplyScalar(span * 4));
  camera.lookAt(target);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-1, 2, 1.2); scene.add(sun);   // top-left-front, like the sprites

  const mixer = new THREE.AnimationMixer(model);
  const R = roles(model);
  const out = { roles: Object.fromEntries(Object.entries(R).map(([k, v]) => [k, Array.isArray(v) ? v.map((b) => b.name) : v?.name ?? null])), frames: {} };
  for (const c of clips) {           // {name, source: 'clip:Walk' | 'proc:attack', frames, dirs}
    out.frames[c.name] = {};
    for (const d of c.dirs) {
      const list = [];
      for (let i = 0; i < c.frames; i++) {
        const t = c.loop === false ? i / Math.max(1, c.frames - 1) : i / c.frames;
        mixer.stopAllAction(); model.traverse((o) => { if (o.isBone && o.userData.rest) { o.quaternion.copy(o.userData.rest.q); o.position.copy(o.userData.rest.p); } });
        model.traverse((o) => { if (o.isBone && !o.userData.rest) o.userData.rest = { q: o.quaternion.clone(), p: o.position.clone() }; });
        holder.position.set(0, 0, 0); holder.rotation.set(0, 0, 0); yaw.rotation.set(0, 0, 0);
        const base = c.source.startsWith('clip:') ? c.source.slice(5) : (c.base || null);
        if (base) {
          const clip = g.animations.find((a) => a.name === base);
          const act = mixer.clipAction(clip); act.play();
          mixer.setTime(c.source.startsWith('clip:') ? t * clip.duration : (c.baseTime || 0));
        }
        model.updateMatrixWorld(true);
        if (c.source.startsWith('proc:')) procPose(c.source.slice(5), t, R, holder, size0);
        yaw.rotation.y = DIRS[d] * Math.PI / 180;
        scene.updateMatrixWorld(true);
        renderer.render(scene, camera);
        list.push(renderer.domElement.toDataURL('image/png'));
      }
      out.frames[c.name][d] = list;
    }
  }
  return out;
};
window.ready = true;
</script></body></html>
